# Also applies to: Qwen/Qwen3-30B-A3B-Instruct-2507, unsloth/Qwen3-30B-A3B-Instruct-2507-bnb-4bit

training:
  max_seq_length: 2048
  num_epochs: 0
  learning_rate: 2e-4
  batch_size: 1
  gradient_accumulation_steps: 1
  warmup_steps: 5
  max_steps: 50
  save_steps: 50
  weight_decay: 0.001
  random_seed: 3407
  packing: true
  train_on_completions: false
  gradient_checkpointing: "unsloth"
  optim: "adamw_8bit"
  lr_scheduler_type: "linear"

lora:
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
    - "gate_up_proj"
  use_rslora: false
  use_loftq: true
  use_dora: false

logging:
  enable_wandb: false
  wandb_project: "llm-finetuning"
  enable_tensorboard: true
  tensorboard_dir: "runs"
  log_frequency: 20

inference:
  temperature: 0.6
  top_k: 10
  top_p: 0.95

