# Also applies to: unsloth/ERNIE-4.5-21B-A3B-PT

training:
  max_seq_length: 2048
  num_epochs: 1
  learning_rate: 2e-4
  batch_size: 4
  gradient_accumulation_steps: 2
  warmup_steps: 5
  max_steps: 30
  save_steps: 40
  weight_decay: 0.001
  random_seed: 3407
  packing: false
  train_on_completions: true
  gradient_checkpointing: "unsloth"
  optim: "adamw_8bit"
  lr_scheduler_type: "linear"

lora:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_rslora: false
  use_loftq: true
  use_dora: false

logging:
  enable_wandb: false
  wandb_project: "llm-finetuning"
  enable_tensorboard: true
  tensorboard_dir: "runs"
  log_frequency: 20
